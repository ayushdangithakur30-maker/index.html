<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Sakshi ❤️</title>
    <style>
        :root {
            --primary-pink: #d63384;
            --button-pink: #ff4d6d;
            --bg-pink: #ffeef2;
        }

        body {
            margin: 0;
            background-color: var(--bg-pink);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            color: var(--primary-pink);
        }

        #main-content { 
            width: 100%; 
            height: 100vh; 
            display: none; 
            position: relative;
        }

        /* --- FLOATING DARK HEARTS --- */
        .floating-heart {
            position: fixed;
            bottom: -50px;
            color: #a4133c; 
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            z-index: 5;
            animation: floatUp linear forwards;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 85%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            box-sizing: border-box;
        }

        h1 { font-size: 1.5rem; margin-bottom: 20px; }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }

        .btn {
            background-color: var(--button-pink);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            white-space: nowrap;
        }

        #no-btn { 
            position: relative; /* Changed from absolute to prevent overlap initially */
            z-index: 31;
        }

        .hidden { display: none !important; }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .gift-box {
            background: #ffb3c1;
            padding: 20px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            color: var(--primary-pink);
            transition: 0.3s;
            font-size: 14px;
        }

        .gift-box:active { transform: scale(0.95); }

        /* --- FINAL TREE PAGE --- */
        #page3 {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* Keeps content at bottom */
            padding-bottom: 40px;
        }

        #treeCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .final-msg {
            z-index: 10;
            color: var(--primary-pink);
            font-size: 1.2rem;
            font-weight: bold;
            width: 90%;
            pointer-events: none;
            text-shadow: 0 0 10px white;
            margin-bottom: 20px;
        }

        .video-action-centered {
            z-index: 15;
            position: relative;
        }

        .special-btn {
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(8px);
            border: 2px solid var(--button-pink);
            color: var(--primary-pink); 
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.4s;
            text-decoration: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="main-content">
    <div id="page1" class="container">
        <h1>Sakshi, will you be my Valentine? 🌹</h1>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpsemN4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4JnB0PWEmZXA9djFfaW50ZXJuYWxfZ2lmX2J5X2lkJmN0PWc/c76IJLufpNwSULPk77/giphy.gif" width="150">
        <div class="btn-container">
            <button class="btn" onclick="showPage(2)">Yes!</button>
            <button class="btn" id="no-btn" onmouseover="moveButton()" onclick="moveButton()">No</button>
        </div>
    </div>

    <div id="page2" class="container hidden">
        <h1>Yay! You said yes! ❤️</h1>
        <p>Open the gifts babe 🎁</p>
        <div class="gift-grid">
            <div class="gift-box" onclick="giftClick(this, 'https://cyan-doreen-22.tiiny.site')">Gift 1 🎀</div>
            <div class="gift-box" onclick="giftClick(this, 'https://emerald-gayle-93.tiiny.site')">Gift 2 🧸</div>
            <div class="gift-box" onclick="giftClick(this, 'https://violet-corinne-6.tiiny.site')">Gift 3 🌹</div>
            <div class="gift-box" onclick="giftClick(this, 'https://aqua-cecilia-71.tiiny.site')">Gift 4 🥰</div>
        </div>
        <br>
        <button class="btn" onclick="showPage(3)">One Last Surprise ✨</button>
    </div>

    <div id="page3" class="hidden">
        <canvas id="treeCanvas"></canvas>
        <div class="final-msg">“Babe specially, I made this for you✨🌹”</div>
        <div class="video-action-centered">
            <a href="https://blue-nat-76.tiiny.site" target="_blank" class="special-btn">
                <span>▶️</span> WATCH SPECIAL VIDEO <span>❤️</span>
            </a>
        </div>
    </div>
</div>

<script>
    // --- FLOATING HEARTS ---
    function spawnHeart() {
        const heart = document.createElement("div");
        heart.classList.add("floating-heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = Math.random() * 3 + 4 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
    }
    setInterval(spawnHeart, 600);

    // --- PASSWORD CHECK ---
    (function() {
        var p = prompt("Enter the secret password ❤️");
        if (p === "sakshiraj") { 
            document.getElementById("main-content").style.display = "block"; 
        } else { 
            alert("Wrong password!"); 
            window.location.reload();
        }
    })();

    function giftClick(element, url) {
        element.style.background = "#ff4d6d";
        element.style.color = "white";
        setTimeout(() => { window.open(url, '_blank'); }, 150);
    }

    function showPage(n) {
        document.querySelectorAll('.container, #page3').forEach(el => el.classList.add('hidden'));
        if(n === 3) {
            document.getElementById('page3').classList.remove('hidden');
            initTree();
        } else {
            document.getElementById('page' + n).classList.remove('hidden');
        }
    }

    // --- RESPONSIVE TREE ---
    function initTree() {
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd'];
        const heartPositions = [];

        function drawHeart(x, y, size) {
            ctx.save();
            ctx.beginPath();
            ctx.translate(x, y);
            ctx.rotate(Math.random() * Math.PI);
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size/2, -size/2, -size, size/3, 0, size);
            ctx.bezierCurveTo(size, size/3, size/2, -size/2, 0, 0);
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
            ctx.fill();
            ctx.restore();
        }

        function createTree(startX, startY, len, angle, branchWidth) {
            const x2 = startX + Math.cos(angle * Math.PI / 180) * len;
            const y2 = startY + Math.sin(angle * Math.PI / 180) * len;
            
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = "#ffb3c1";
            ctx.lineWidth = branchWidth;
            ctx.lineCap = 'round';
            ctx.stroke();

            if (len < 10) {
                heartPositions.push({x: x2, y: y2});
                return;
            }
            
            setTimeout(() => {
                createTree(x2, y2, len * 0.8, angle - 25, branchWidth * 0.7);
                createTree(x2, y2, len * 0.8, angle + 25, branchWidth * 0.7);
            }, 40);
        }

        // Adjust tree size based on screen width
        const treeSize = Math.min(window.innerWidth * 0.2, 110);
        createTree(canvas.width / 2, canvas.height - 120, treeSize, -90, 8);

        setInterval(() => {
            if (heartPositions.length > 0) {
                const pos = heartPositions[Math.floor(Math.random() * heartPositions.length)];
                drawHeart(pos.x + (Math.random()*100-50), pos.y + (Math.random()*100-50), Math.random()*8 + 4);
            }
        }, 300); 
    }

    // --- SMART BUTTON MOVE ---
    function moveButton() {
        const btn = document.getElementById('no-btn');
        btn.style.position = "fixed"; // Switch to fixed once interaction starts
        
        // Ensure the button stays within visible bounds
        const maxX = window.innerWidth - btn.offsetWidth - 20;
        const maxY = window.innerHeight - btn.offsetHeight - 20;
        
        const randomX = Math.max(10, Math.random() * maxX);
        const randomY = Math.max(10, Math.random() * maxY);
        
        btn.style.left = randomX + 'px';
        btn.style.top = randomY + 'px';
    }
</script>
</body>
</html>
